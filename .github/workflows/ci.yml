name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Rojo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo (pinned 7.6.1)
        run: |
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip -o rojo.zip
          unzip -q rojo.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build place file from sources
        run: rojo build -o build.rbxl default.project.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbxl-build
          path: build.rbxl
          retention-days: 7
